services:
  mysql:
    image: mysql:8.0
    container_name: haircutms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: haircutms_dev
      MYSQL_DATABASE: haircutms
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql_local_data:/var/lib/mysql
    networks:
      - haircutms-local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: haircutms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_local_data:/data
    networks:
      - haircutms-local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../
      dockerfile: apps/server/Dockerfile
    image: haircutms-server:latest
    container_name: haircutms-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:haircutms_dev@mysql:3306/haircutms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
    ports:
      - '4000:4000'
    networks:
      - haircutms-local
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        API_PROXY_URL: http://server:4000
    image: haircutms-web:latest
    container_name: haircutms-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    networks:
      - haircutms-local
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_local_data:
  redis_local_data:

networks:
  haircutms-local:
    driver: bridge
