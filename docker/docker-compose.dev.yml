version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: haircutms-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: haircutms
      POSTGRES_PASSWORD: haircutms_dev
      POSTGRES_DB: haircutms
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - haircutms-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haircutms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: haircutms-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    networks:
      - haircutms-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  haircutms-dev-network:
    driver: bridge