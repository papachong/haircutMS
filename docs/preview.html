<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RH-HaireCut 系统预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 2rem 1.5rem 1rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.875rem;
      color: #888;
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 0 3.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 16px;
      background: #1a1a1a;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .carousel .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel .slide.active {
      opacity: 1;
      z-index: 1;
    }

    .carousel .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .caption {
      text-align: center;
      padding: 1rem 0 1.5rem;
      z-index: 2;
    }

    .caption h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .caption p {
      font-size: 0.8rem;
      color: #777;
      margin-top: 0.25rem;
    }

    /* Nav arrows */
    .nav-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      z-index: 10;
      width: 2.5rem;
      height: 2.5rem;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      font-size: 1.25rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .nav-btn.prev { left: 0; }
    .nav-btn.next { right: 0; }

    /* Dots */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-bottom: 1.5rem;
    }

    .dots button {
      width: 8px;
      height: 8px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, transform 0.2s;
    }

    .dots button.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* Counter */
    .counter {
      position: absolute;
      bottom: 12px;
      right: 14px;
      z-index: 10;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
    }

    footer a {
      color: #888;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }

    @media (min-width: 768px) {
      .carousel-wrapper {
        max-width: 400px;
        padding: 0 4rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>✂️ RH-HaireCut 系统预览</h1>
    <p>左右滑动或点击箭头浏览</p>
  </header>

  <div class="carousel-wrapper">
    <button class="nav-btn prev" aria-label="上一张">&#8249;</button>
    <button class="nav-btn next" aria-label="下一张">&#8250;</button>

    <div class="carousel" id="carousel">
      <div class="slide active">
        <img src="pics/store-register.png" alt="店铺注册" />
      </div>
      <div class="slide">
        <img src="pics/dashboard.jpeg" alt="营收看板" />
      </div>
      <div class="slide">
        <img src="pics/order-list.jpeg" alt="订单列表" />
      </div>
      <div class="slide">
        <img src="pics/ticket.jpeg" alt="电子小票" />
      </div>
      <div class="slide">
        <img src="pics/memeber-detail.jpeg" alt="会员详情" />
      </div>
      <div class="slide">
        <img src="pics/memeber-analysis.jpeg" alt="会员分析" />
      </div>
      <div class="slide">
        <img src="pics/settings-store.png" alt="店铺设置" />
      </div>
      <span class="counter" id="counter">1 / 7</span>
    </div>

    <div class="caption">
      <h2 id="caption-title">店铺注册</h2>
      <p id="caption-desc">30 秒注册，立即开始营业</p>
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <footer>
    <a href="https://lifa.ruhooai.com/">立即体验</a> ·
    <a href="https://github.com/papachong/haircutMS">GitHub</a>
  </footer>

  <script>
    const slides = document.querySelectorAll('.slide');
    const total = slides.length;
    let current = 0;

    const captions = [
      { title: '店铺注册', desc: '30 秒注册，立即开始营业' },
      { title: '营收看板', desc: '今日营收、订单数、会员数据一目了然' },
      { title: '快速开单', desc: '选择服务 → 结算 → 完成' },
      { title: '电子小票', desc: '门店专属水印，一键分享给顾客' },
      { title: '会员详情', desc: '余额、次卡、消费记录全掌握' },
      { title: '会员分析', desc: '等级分布与消费趋势分析' },
      { title: '店铺设置', desc: '营业时间、服务项目灵活配置' },
    ];

    const counterEl = document.getElementById('counter');
    const captionTitle = document.getElementById('caption-title');
    const captionDesc = document.getElementById('caption-desc');
    const dotsEl = document.getElementById('dots');

    // Build dots
    for (let i = 0; i < total; i++) {
      const btn = document.createElement('button');
      btn.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(btn);
    }

    function goTo(index) {
      slides[current].classList.remove('active');
      current = (index + total) % total;
      slides[current].classList.add('active');
      counterEl.textContent = (current + 1) + ' / ' + total;
      captionTitle.textContent = captions[current].title;
      captionDesc.textContent = captions[current].desc;

      const dots = dotsEl.querySelectorAll('button');
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    document.querySelector('.nav-btn.prev').addEventListener('click', () => goTo(current - 1));
    document.querySelector('.nav-btn.next').addEventListener('click', () => goTo(current + 1));

    // Keyboard nav
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    // Touch swipe
    let touchStartX = 0;
    const carousel = document.getElementById('carousel');
    carousel.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    carousel.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 40) {
        goTo(current + (diff > 0 ? -1 : 1));
      }
    }, { passive: true });
  </script>
</body>
</html>
